# Builds AIOLists from our fork (amasolov/AIOLists, `deploy` branch) and
# publishes to GHCR.
#
# The fork carries a search-encoding fix (SebastianMorel/AIOLists#102) that has
# no path into an upstream published image.
#
# THIS IS INTENDED TO BE TEMPORARY. Once #102 merges and GHCR publishes a commit
# containing it, point the aiolists HelmRelease in ktmb1/home-ops back at the
# upstream image and delete this workflow.
#
# The fork is quiet, so there is no schedule: builds run on demand, or when the
# `deploy` branch is updated (which requires the repository_dispatch below,
# since this workflow lives in a different repo than the source).
name: build-aiolists

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Fork git ref to build (blank = deploy branch head)"
        required: false
        type: string
  # Lets the fork trigger a rebuild after pushing to `deploy`:
  #   gh api repos/ktmb1/containers/dispatches -f event_type=aiolists-rebuild
  repository_dispatch:
    types: [aiolists-rebuild]

concurrency:
  group: build-aiolists
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: amasolov/AIOLists
          ref: ${{ inputs.revision || 'deploy' }}
          persist-credentials: false

      # Tag by commit SHA so each build is individually addressable and the
      # deployment can pin an exact commit, the way the old `sha-<commit>`
      # upstream tags worked.
      - name: Resolve commit
        id: rev
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short=7 HEAD)"
          echo "Building AIOLists at commit ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Upstream ships a working multi-stage Dockerfile at the repo root
      # (node:18-alpine, npm ci --omit=dev, `npm run prod` on :7000).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ktmb1/aiolists:sha-${{ steps.rev.outputs.sha }}
            ghcr.io/ktmb1/aiolists:latest
          labels: |
            org.opencontainers.image.source=https://github.com/amasolov/AIOLists
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Published \`ghcr.io/ktmb1/aiolists:sha-${{ steps.rev.outputs.sha }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin it in the aiolists HelmRelease in ktmb1/home-ops to deploy it." >> "$GITHUB_STEP_SUMMARY"
