---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Build"

# Builds the images in this repo and pushes them to GHCR. Each image is one
# directory with a Dockerfile; add a matrix entry to add an image.
#
# Only images whose own inputs changed are built. Rebuilding an unchanged image
# republishes it under the same tag with a new digest - the contents are
# identical apart from build timestamps (apt logs, /etc/shadow's age counter,
# the ldconfig cache) - and each of those digests becomes a Renovate PR in
# ktmb1/home-ops. That noise is not free: it is what a genuine
# extension/operand divergence would have to be noticed among.
#
# Base-image CVE fixes therefore no longer rely on a blind weekly rebuild.
# .renovaterc.json5 sets pinDigests, so a rebased debian:trixie-slim or CNPG
# operand arrives as a digest PR against the Dockerfile that pins it - which
# makes that image changed here, and rebuilds exactly it.
#
# On a pull request the images are built but not pushed, so a change can be
# checked without publishing it.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  # A safety net for what change detection cannot see: a base image rebuilt
  # under its tag before Renovate has opened the digest PR, or a push whose
  # build failed after the merge. Rebuilds everything, deliberately.
  schedule:
    - cron: "0 6 * * 1"
  # The manual "rebuild it all now" escape hatch. Also rebuilds everything.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: timescaledb-extension
            context: timescaledb-extension
            # Tag is <ext-version>-<pg-major>; both are build args so a bump is
            # a one-line change here. `version` is the default the control file
            # advertises; `versions` is everything whose .so ships, and must
            # contain `version`.
            #
            # `versions` carries more than `version` only while a database still
            # records an older one in pg_extension: TimescaleDB loads the exact
            # version-suffixed .so named there, so dropping a version still in
            # use breaks every session on that database. 2.25.2 was carried for
            # that reason and has been dropped now the db1 databases are on
            # 2.29.2.
            version: "2.29.2"
            versions: "2.29.2"
            pg_major: "18"
            # The extension is compiled against this image and verified to load
            # in it before anything is pushed. Keep it identical to the
            # Cluster.spec.imageName the cluster runs, or the published image
            # can fail to load there while the build stays green.
            operand: "ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:c2a773217853c6e0ffe7da9c37ea456466efb20cf844f27511a73fa6a81e3152"

          - name: postgis-extension
            context: postgis-extension
            # Tag is <postgis-version>-<pg-major>, matching timescaledb-extension:
            # the .so is only loadable in the Postgres major it was built for.
            #
            # Unlike TimescaleDB this is not compiled here - it repackages the
            # pgdg postgresql-<major>-postgis-3 package into CNPG's extension
            # image layout, bundling the GEOS/PROJ shared libraries the operand
            # does not ship. `version` must match the pgdg package's
            # default_version; the Dockerfile asserts that rather than trusting
            # it.
            version: "3.6.4"
            pg_major: "18"
            # Same rule as timescaledb-extension: keep this identical to the
            # Cluster.spec.imageName the cluster runs. The bundled libraries are
            # resolved against this operand's linker.
            operand: "ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:c2a773217853c6e0ffe7da9c37ea456466efb20cf844f27511a73fa6a81e3152"

          - name: chrony
            context: chrony
            # The full Debian package version, including the packaging revision
            # (-3) and the stable-update suffix (+deb13u2). Renovate tracks this
            # through the `deb` datasource - see .renovaterc.json5 - so a
            # security update to Debian's chrony opens a PR here rather than
            # landing silently in the weekly rebuild.
            #
            # Upstream chrony is frozen within a Debian stable release, so what
            # actually moves is the part after the first "-". The Dockerfile
            # installs this exact version, so the tag and the contents agree.
            version: "4.6.1-3+deb13u2"

          - name: predbat
            context: predbat
            # The upstream Predbat release tag, tracked by Renovate through the
            # github-releases datasource. The Dockerfile downloads this exact
            # tag rather than letting Predbat's own startup.py fetch "latest"
            # into the config volume at first boot, so the running version is a
            # property of the image and not of when the volume was created.
            version: "v8.54.3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A push is diffed against its own parent, so the full history has to
          # be here; a shallow clone would make the merge-base unreachable.
          fetch-depth: 0

      # Decide whether THIS image needs building. Each job answers only for
      # itself, so the matrix above stays the single list of what exists - no
      # second copy to fall out of step with it.
      - name: Does this image need building?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTEXT: ${{ matrix.context }}
        run: |
          set -euo pipefail

          # schedule and workflow_dispatch are the deliberate rebuild-all paths.
          if [ "${EVENT}" = "schedule" ] || [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "${EVENT}: rebuilding regardless of what changed"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${EVENT}" = "pull_request" ]; then
            base="${BASE_SHA}"
          else
            base="${BEFORE}"
          fi

          # A branch's first push reports an all-zero `before`, and a force-push
          # can name a commit that is no longer reachable. Neither is a diff we
          # can take, so build rather than silently skip.
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit (${base:-unset}); building to be safe"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "${base}...HEAD")"
          echo "Changed files:"
          echo "${files}" | sed 's/^/  /'

          # This image's own directory, or the workflow itself - which carries
          # the build args, the verify steps and the matrix values, so a change
          # to it can alter any image.
          if echo "${files}" | grep -qE "^${CONTEXT}/" \
             || echo "${files}" | grep -qxF ".github/workflows/build.yaml"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "==> building ${CONTEXT}"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "==> nothing under ${CONTEXT}/ changed, skipping"
          fi

      - name: Set up Buildx
        if: ${{ steps.changed.outputs.build == 'true' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        # Skipped on pull_request: the token is read-only there and nothing is
        # pushed, so logging in would fail for no benefit.
        if: ${{ github.event_name != 'pull_request' && steps.changed.outputs.build == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build to the local daemon first so the image can be verified before it
      # is published. A push here would mean a broken image reaches GHCR - and
      # with Renovate automerging, reaches main - before anything checks it.
      - name: Build
        if: ${{ steps.changed.outputs.build == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          load: true
          # Only the timescaledb-extension build consumes these; an image whose
          # Dockerfile declares no matching ARG ignores them.
          build-args: |
            PG_OPERAND_IMAGE=${{ matrix.operand }}
            PG_MAJOR=${{ matrix.pg_major }}
            TIMESCALEDB_VERSION=${{ matrix.version }}
            TIMESCALEDB_VERSIONS=${{ matrix.versions }}
            POSTGIS_VERSION=${{ matrix.version }}
            CHRONY_VERSION=${{ matrix.version }}
            PREDBAT_VERSION=${{ matrix.version }}
          tags: ${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Dockerfile's own checks prove the right files were produced; they
      # cannot prove those files load. This mounts the extension into the real
      # operand the way CNPG does and exercises every shipped version.
      - name: Verify the extension loads in the operand
        if: ${{ matrix.name == 'timescaledb-extension' && steps.changed.outputs.build == 'true' }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          # `docker create` needs a command and this image is FROM scratch with
          # none, so unpack the saved layers instead. Layer paths come from the
          # manifest: their naming differs between Docker versions and OCI
          # layouts, so globbing for them is not reliable.
          layers="$(mktemp -d)"
          docker save ${{ matrix.name }}:ci | tar -x -C "$layers"
          python3 -c '
          import json, subprocess, sys, os
          root = sys.argv[1]
          dest = sys.argv[2]
          manifest = json.load(open(os.path.join(root, "manifest.json")))
          layers = manifest[0]["Layers"]
          if not layers:
              sys.exit("image has no layers")
          for layer in layers:
              subprocess.run(
                  ["tar", "-xf", os.path.join(root, layer), "-C", dest],
                  check=True,
              )
          ' "$layers" "$out"
          test -d "$out/lib" && test -d "$out/share/extension"
          ./${{ matrix.context }}/verify.sh \
            "$out" \
            "${{ matrix.operand }}" \
            "${{ matrix.version }}" \
            "${{ matrix.versions }}"

      # Same reasoning as the timescaledb verify above, plus one more failure
      # mode: this image bundles GEOS/PROJ, so it can build perfectly and still
      # fail at dlopen with `libgeos_c.so.1: cannot open shared object file`.
      # The script mounts it with the LD_LIBRARY_PATH and PROJ_DATA the Cluster
      # supplies and exercises the geometry column LTSS actually uses.
      - name: Verify PostGIS loads in the operand
        if: ${{ matrix.name == 'postgis-extension' && steps.changed.outputs.build == 'true' }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          layers="$(mktemp -d)"
          docker save ${{ matrix.name }}:ci | tar -x -C "$layers"
          python3 -c '
          import json, subprocess, sys, os
          root = sys.argv[1]
          dest = sys.argv[2]
          manifest = json.load(open(os.path.join(root, "manifest.json")))
          layers = manifest[0]["Layers"]
          if not layers:
              sys.exit("image has no layers")
          for layer in layers:
              subprocess.run(
                  ["tar", "-xf", os.path.join(root, layer), "-C", dest],
                  check=True,
              )
          ' "$layers" "$out"
          test -d "$out/lib" && test -d "$out/share/extension" && test -d "$out/proj"
          ./${{ matrix.context }}/verify.sh \
            "$out" \
            "${{ matrix.operand }}" \
            "${{ matrix.version }}"

      # A chrony image that builds proves nothing: every failure this image hit
      # in development built cleanly and died at runtime (a USER directive, a
      # missing /run/chrony, too few capabilities), and one did not even die -
      # it served stratum 10 from its own reference while tracking upstream
      # perfectly. So start it and ask it the time.
      - name: Verify chrony serves NTP
        if: ${{ matrix.name == 'chrony' && steps.changed.outputs.build == 'true' }}
        run: ./chrony/verify.sh ${{ matrix.name }}:ci

      # The point of this image is that Predbat's logs stay off the replicated
      # PVC its state lives on, and that is invisible in a build: a broken
      # redirect produces an image that starts perfectly and quietly writes
      # 100MiB of rotating log onto the volume. This starts it against a stub
      # Home Assistant and checks where the bytes actually land, including
      # across a rotation - the case where a symlink-based redirect silently
      # reverts to the PVC.
      - name: Verify Predbat keeps logs off the state volume
        if: ${{ matrix.name == 'predbat' && steps.changed.outputs.build == 'true' }}
        run: ./predbat/verify.sh ${{ matrix.name }}:ci

      # The tag suffix differs by image: the extension is keyed to a Postgres
      # major (the .so is only loadable in that one), while chrony is keyed to
      # its own version alone.
      - name: Resolve published tags
        id: tags
        if: ${{ steps.changed.outputs.build == 'true' }}
        run: |
          set -euo pipefail
          base="ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}"
          if [ -n "${{ matrix.pg_major }}" ]; then
            version="${{ matrix.version }}-${{ matrix.pg_major }}"
          else
            version="${{ matrix.version }}"
          fi
          # A Debian version like 4.6.1-3+deb13u2 is not a legal OCI tag: "+"
          # is outside the permitted [a-zA-Z0-9._-] set and the registry
          # rejects the reference outright. Map it to "_", which is legal and
          # reversible by eye.
          version="${version//+/_}"
          # One tag only. A second <version>-<git-sha> tag used to be published
          # alongside this as an immutable per-build record, but @sha256: is
          # already exactly that - an immutable, content-addressed name for the
          # build - and consumers pin with it (ktmb1/home-ops writes
          # <tag>@sha256:<digest> everywhere). The git-sha tag was a competing
          # second name for the same image, and an actively harmful one:
          # home-ops tracks this image with versioning=loose, which sorts the
          # longer "2.29.2-18-<sha>" above "2.29.2-18" and offered it as a
          # patch upgrade - a silent downgrade to whichever build sorted
          # highest, pinning the cluster to a frozen tag that never gets
          # rebuilds again.
          {
            echo "list<<EOF"
            echo "${base}:${version}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Only now, with the image proven working, publish it.
      - name: Push
        if: ${{ github.event_name != 'pull_request' && steps.changed.outputs.build == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          push: true
          build-args: |
            PG_OPERAND_IMAGE=${{ matrix.operand }}
            PG_MAJOR=${{ matrix.pg_major }}
            TIMESCALEDB_VERSION=${{ matrix.version }}
            TIMESCALEDB_VERSIONS=${{ matrix.versions }}
            POSTGIS_VERSION=${{ matrix.version }}
            CHRONY_VERSION=${{ matrix.version }}
            PREDBAT_VERSION=${{ matrix.version }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
