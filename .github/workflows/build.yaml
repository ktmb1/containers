---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Build"

# Builds every image in this repo and pushes it to GHCR. Each image is one
# directory with a Dockerfile; add a matrix entry to add an image.
#
# On a pull request the images are built but not pushed, so a change can be
# checked without publishing it.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  # Rebuild on a schedule so base-image CVE fixes land without a code change.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: timescaledb-extension
            context: timescaledb-extension
            # Tag is <ext-version>-<pg-major>; both are build args so a bump is
            # a one-line change here.
            version: "2.29.2"
            pg_major: "18"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        # Skipped on pull_request: the token is read-only there and nothing is
        # pushed, so logging in would fail for no benefit.
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            PG_MAJOR=${{ matrix.pg_major }}
            TIMESCALEDB_VERSION=${{ matrix.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ matrix.version }}-${{ matrix.pg_major }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ matrix.version }}-${{ matrix.pg_major }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
