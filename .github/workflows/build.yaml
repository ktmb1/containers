---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Build"

# Builds every image in this repo and pushes it to GHCR. Each image is one
# directory with a Dockerfile; add a matrix entry to add an image.
#
# On a pull request the images are built but not pushed, so a change can be
# checked without publishing it.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  # Rebuild on a schedule so base-image CVE fixes land without a code change.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: timescaledb-extension
            context: timescaledb-extension
            # Tag is <ext-version>-<pg-major>; both are build args so a bump is
            # a one-line change here. `version` is the default the control file
            # advertises; `versions` is everything whose .so ships, and must
            # contain `version`.
            #
            # `versions` carries more than `version` only while a database still
            # records an older one in pg_extension: TimescaleDB loads the exact
            # version-suffixed .so named there, so dropping a version still in
            # use breaks every session on that database. 2.25.2 was carried for
            # that reason and has been dropped now the db1 databases are on
            # 2.29.2.
            version: "2.29.2"
            versions: "2.29.2"
            pg_major: "18"
            # The extension is compiled against this image and verified to load
            # in it before anything is pushed. Keep it identical to the
            # Cluster.spec.imageName the cluster runs, or the published image
            # can fail to load there while the build stays green.
            operand: "ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        # Skipped on pull_request: the token is read-only there and nothing is
        # pushed, so logging in would fail for no benefit.
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build to the local daemon first so the image can be verified before it
      # is published. A push here would mean a broken image reaches GHCR - and
      # with Renovate automerging, reaches main - before anything checks it.
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          load: true
          build-args: |
            PG_OPERAND_IMAGE=${{ matrix.operand }}
            PG_MAJOR=${{ matrix.pg_major }}
            TIMESCALEDB_VERSION=${{ matrix.version }}
            TIMESCALEDB_VERSIONS=${{ matrix.versions }}
          tags: ${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Dockerfile's own checks prove the right files were produced; they
      # cannot prove those files load. This mounts the extension into the real
      # operand the way CNPG does and exercises every shipped version.
      - name: Verify the extension loads in the operand
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          # `docker create` needs a command and this image is FROM scratch with
          # none, so unpack the saved layers instead. Layer paths come from the
          # manifest: their naming differs between Docker versions and OCI
          # layouts, so globbing for them is not reliable.
          layers="$(mktemp -d)"
          docker save ${{ matrix.name }}:ci | tar -x -C "$layers"
          python3 -c '
          import json, subprocess, sys, os
          root = sys.argv[1]
          dest = sys.argv[2]
          manifest = json.load(open(os.path.join(root, "manifest.json")))
          layers = manifest[0]["Layers"]
          if not layers:
              sys.exit("image has no layers")
          for layer in layers:
              subprocess.run(
                  ["tar", "-xf", os.path.join(root, layer), "-C", dest],
                  check=True,
              )
          ' "$layers" "$out"
          test -d "$out/lib" && test -d "$out/share/extension"
          ./${{ matrix.context }}/verify.sh \
            "$out" \
            "${{ matrix.operand }}" \
            "${{ matrix.version }}" \
            "${{ matrix.versions }}"

      # Only now, with the image proven loadable, publish it.
      - name: Push
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.context }}
          platforms: linux/amd64
          push: true
          build-args: |
            PG_OPERAND_IMAGE=${{ matrix.operand }}
            PG_MAJOR=${{ matrix.pg_major }}
            TIMESCALEDB_VERSION=${{ matrix.version }}
            TIMESCALEDB_VERSIONS=${{ matrix.versions }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ matrix.version }}-${{ matrix.pg_major }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ matrix.version }}-${{ matrix.pg_major }}-${{ github.sha }}
          cache-from: type=gha
